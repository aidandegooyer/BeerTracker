version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: beertracker-db
    environment:
      POSTGRES_USER: beertracker
      POSTGRES_PASSWORD: beertracker_dev
      POSTGRES_DB: beertracker
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beertracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beertracker-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://beertracker:beertracker_dev@db:5432/beertracker
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    command: npm start

volumes:
  db-data:
  uploads:
